trigger:
  - main

pool:
  vmImage: "ubuntu-latest"

variables:
  pythonVersion: "3.14"
  RESOURCE_GROUP: "webapp"
  WEB_APP_NAME: "pythonapp87696858"
  WEB_APP_PLAN: "ASP-webapp-b9dd"
  WEBSITE_LOCATION: "Canada Central"

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "$(pythonVersion)"
    displayName: "Use Python $(pythonVersion)"

  - script: |
      python --version
      pip --version
    displayName: "Check Python and Pip Versions"

  - script: |
      docker --version
    displayName: "Check Docker Version"

  - task: AzureAppConfigurationExport@10
    inputs:
      ConnectedServiceName: "AzureWebAppPython"
      ConfigStoreName: "pythonapp87696858"
      AppConfigurationEndpoint: "https://pythonapp87696858.azconfig.io"
      OutputFile: "appsettings.json"
    displayName: "Export App Configuration"

  - task: ArchiveFiles@2
    inputs:
      rootFolderOrFile: "$(Build.SourcesDirectory)"
      includeRootFolder: false
      archiveType: "zip"
      archiveFile: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
      replaceExistingArchive: true
    displayName: "Archive Files"

  - task: AzureWebApp@1
    inputs:
      azureSubscription: "AzureWebAppPython"
      appType: "webAppLinux"
      appName: "$(WEB_APP_NAME)"
      package: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
    displayName: "Deploy to Azure Web App"